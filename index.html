olid #dde5eb;border-radius:8px;padding:7px 4px;text-align:center;color:#566a7b;font-weight:800}.choice.selected{background:#007d86;color:#fff;border-color:#007d86}.choice.goodsel{background:#e2f7ea;color:#10774e;border-color:#85cba8}.choice.badsel{background:#fff0ef;color:#c3424b;border-color:#f2afb1}.choice.blank{color:#a5aeb7}.qscore{font-size:11px;color:#7d8999;font-weight:700}.tfrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px dashed #e7eef3;padding:7px 0}.tfrow:first-of-type{border-top:0}.tf-controls{display:flex;gap:5px}.tf-controls .choice{min-width:42px;padding:5px 9px}.answer-table{border-collapse:collapse;width:100%}.answer-table th,.answer-table td{border-bottom:1px solid #e7edf2;text-align:left;padding:10px}.answer-table th{background:#f7fafc;color:#68788c;font-size:12px}.result-ok{color:var(--green);font-weight:800}.result-bad{color:var(--red);font-weight:800}.notice{border-radius:13px;padding:12px 14px;background:#fff8eb;border:1px solid #f1e3be;color:#865d22;font-size:13px}.notice.blue{color:#315975;background:#eef7fc;border-color:#d7eaf6}.notice.green{color:#11705c;background:#effbf5;border-color:#c3e7d9}.tabstrip{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tabbtn{border:1px solid #d8e4eb;border-radius:25px;padding:9px 14px;white-space:nowrap;background:#fff;color:#677b8c;font-weight:750}.tabbtn.active{background:#102a45;border-color:#102a45;color:#fff}.cam-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:18px}.cam-box{background:#172334;min-height:290px;display:flex;align-items:center;justify-content:center;border-radius:15px;overflow:hidden;position:relative}.cam-box video,.cam-box canvas{width:100%;max-height:560px;object-fit:contain}.cam-placeholder{text-align:center;color:#b2c5d5;max-width:300px;padding:30px}.cam-placeholder .big{font-size:55px}.scan-mark{font-size:12px;font-weight:750;color:#187b7d;background:#dff4f0;padding:6px 10px;border-radius:8px}.scan-mark.bad{color:#b64448;background:#fff0ed}.history-table{width:100%;border-collapse:collapse}.history-table th{text-align:left;background:#f6f8fb;font-size:12px;color:#6d7e8d;padding:11px}.history-table td{padding:12px 11px;border-bottom:1px solid #e6ebef}.scrollx{overflow-x:auto}.empty{text-align:center;padding:32px;color:#91a1af}.toast{position:fixed;right:20px;bottom:22px;background:#102e3e;color:white;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #0003;max-width:370px;z-index:50;display:none}.toast.show{display:block}.footnote{font-size:11px;color:#8d9bab;margin-top:22px;text-align:center}.hidden{display:none!important}.overlay-stage{position:relative;display:inline-block;max-width:100%}.overlay-stage canvas{display:block;cursor:crosshair}.stepnum{display:inline-flex;width:25px;height:25px;background:#ddf2f0;color:#126873;font-weight:850;border-radius:50%;align-items:center;justify-content:center;margin-right:8px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;gap:4px;overflow:auto;white-space:nowrap;padding:8px}.side-label{display:none}.nav{margin:0;padding:10px 11px;white-space:nowrap;width:auto;font-size:12px}.nav .ico{width:auto}.qgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.twocol[style]{grid-template-columns:minmax(0,1fr)!important;min-width:0}.shell{padding:11px 11px 28px}.header{padding:18px 16px;border-radius:17px;align-items:flex-start}.head-title{font-size:21px}.head-tags{display:none}.logo{width:45px;height:45px;font-size:25px}.layout{gap:13px;margin-top:13px}.card{padding:14px;border-radius:14px}.page-intro h1{font-size:20px}.config-grid,.score-parts,.cam-layout{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.threecol{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.threecol .stat{padding:11px 9px}.threecol .stat .number{font-size:19px}.qgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.qbox{padding:9px}.choice{min-width:26px}.score-banner .student-name{font-size:19px}.score-total{font-size:34px}.score-parts{gap:8px}.score-part{padding:10px 12px}.score-parts .score-part b{font-size:19px}.nav{gap:5px}.nav .ico{font-size:16px}.tag{display:none}}@media(max-width:420px){.qgrid{grid-template-columns:1fr 1fr}.field.short{width:102px}.btn{padding:10px}.form3{grid-template-columns:1fr 1fr}}

/* Phiên bản 2: danh sách học sinh dùng một lần, chọn lại khi SBD không rõ */
.student-id-panel{border:1px solid #d9eae7;background:#f9fdfc;border-radius:14px;padding:15px}

<body>
<div class="shell"><header class="header"><div class="brand"><div class="logo">◉</div><div><div class="head-title">Smart<span style="color:#65e2d2">OMR</span> <span style="font-size:12px;color:#bceee9;vertical-align:middle">DEMO</span></div><div class="head-desc">Quét SBD • Tự tìm họ tên • Hiển thị điểm 3 phần</div></div></div><div class="head-tags"><span class="tag">📱 Tối ưu điện thoại</span><span class="tag">✓ Chấm theo điểm từng câu</span></div></header>
<div class="layout"><aside class="sidebar" id="navigation"></aside><main class="content" id="screen"></main></div><p class="footnote">SmartOMR 1.0 – Bản thử nghiệm. Dữ liệu chỉ lưu trong trình duyệt trên thiết bị này, chưa đồng bộ Google Sheets. Sao lưu trước khi đổi điện thoại hoặc xóa dữ liệu trình duyệt.</p></div>
<div id="toast" class="toast"></div>
<script>
(function(){'use strict';
const maxima={one:40,two:8,three:6}, names={one:'Phần I',two:'Phần II',three:'Phần III'}, defaults={one:40,two:8,three:6};
const makeKeys=(n,type)=>Array.from({length:n},(_,i)=>type==='one'?'ABCD'[i%4]:type==='two'?['Đ','S','Đ','S']:['2','-1,5','0,75','12','4,5','10'][i%6]);
const seed={counts:{...defaults},weights:{one:Array(40).fill(.1),two:Array(8).fill(.5),three:Array(6).fill(1/3)},keys:{one:makeKeys(40,'one'),two:makeKeys(8,'two'),three:makeKeys(6,'three')},scoreScale:[0,0,.25,.5,1],student:{name:'Nguyễn Văn An',sbd:'01234567',code:'101'},responses:{one:Array.from({length:40},(_,i)=>i%7===0?'':i%5===0?'A':'ABCD'[i%4]),two:Array.from({length:8},(_,i)=>i%3===0?['Đ','Đ','Đ','S']:['Đ','S','Đ','S']),three:['2','-1,5','0,5','12','4','10']},history:[],roster:[{sbd:'01234567',name:'Nguyễn Văn An',lop:'9A'},{sbd:'12345678',name:'Trần Minh Đức',lop:'9B'},{sbd:'87654321',name:'Lò Thị Hoa',lop:'9C'}]};
const cleanStart={...structuredClone(seed),
 student:{name:'',sbd:'',code:'',lop:''},
 responses:{one:Array(40).fill(''),two:Array.from({length:8},()=>['','','','']),three:Array(6).fill('')},
 keys:{one:Array(40).fill(''),two:Array.from({length:8},()=>['','','','']),three:Array(6).fill('')},
 history:[],roster:[]};
let data;try{const cached=JSON.parse(localStorage.getItem('smartomr_pwa_v1'));data=cached&&cached.counts&&cached.keys&&cached.weights?cached:structuredClone(cleanStart)}catch(e){data=structuredClone(cleanStart)}
if(!Array.isArray(data.roster))data.roster=[];
let tab='grade',section='one',gradeSection='one',keySection='one',camStream=null,photo=null,ctxImg=null,camPts=[],camRead=null;
let ocrState={status:'',raw:'',confidence:0,candidates:[],preview:'',note:''};
let ocrWorkerPromise=null,ocrScriptPromise=null,scanToken=0;

function save(){try{localStorage.setItem('smartomr_pwa_v1',JSON.stringify(data))}catch(e){}}
function esc(t){return String(t===undefined||t===null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v,dp=2){return Number(v||0).toLocaleString('vi-VN',{minimumFractionDigits:dp,maximumFractionDigits:dp})}
function num(v){const x=Number(String(v).replace(',','.'));return Number.isFinite(x)?x:0}
function sumPart(p){return data.weights[p].slice(0,data.counts[p]).reduce((a,b)=>a+Number(b||0),0)}
function allMax(){return ['one','two','three'].reduce((s,p)=>s+sumPart(p),0)}
function answerVal(x){return String(x??'').trim().replace(/\s/g,'').replace(/,/g,'.').replace(/^\+/, '');}
function correct(p,i){if(p==='one')return !!data.responses.one[i]&&data.responses.one[i]===data.keys.one[i];if(p==='three'){const a=answerVal(data.responses.three[i]),b=answerVal(data.keys.three[i]);return a!==''&&b!==''&&(a===b||(!isNaN(Number(a))&&!isNaN(Number(b))&&Math.abs(Number(a)-Number(b))<.00000001));}return null}
function grading(){let out={},sum=0;for(const p of ['one','two','three']){let total=0,details=[];for(let i=0;i<data.counts[p];i++){const weight=Number(data.weights[p][i]||0);let earned=0,ok=false,partial=false,filled=false;if(p==='two'){const response=Array.isArray(data.responses.two[i])?data.responses.two[i]:['','','',''];const answer=Array.isArray(data.keys.two[i])?data.keys.two[i]:['','','',''];const n=answer.filter((a,j)=>response[j]!==''&&a===response[j]).length;filled=response.some(Boolean);earned=weight*Number(data.scoreScale[n]??0);ok=n===4;partial=n>0&&n<4;details.push({earned,max:weight,n,ok,partial,filled});}else{filled=String(data.responses[p][i]||'').trim().length>0;ok=correct(p,i);earned=ok?weight:0;details.push({earned,max:weight,ok,filled})}total+=earned}out[p]={earned:total,max:sumPart(p),details};sum+=total}out.total=sum;out.max=allMax();return out}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.classList.remove('show'),3300)}
function nav(){const items=[['grade','📊','Chấm bài & kết quả'],['config','⚙️','Cấu hình điểm'],['keys','🗝️','Đáp án chuẩn'],['camera','📷','Quét bằng camera'],['students','👥','Danh sách học sinh'],['history','📁','Lịch sử chấm']];document.getElementById('navigation').innerHTML='<div class="side-label">ỨNG DỤNG</div>'+items.map(([id,ico,label])=>`<button class="nav ${tab===id?'active':''}" data-tab="${id}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('')}
function header(title,sub,right=''){return `<div class="page-intro"><div><h1>${title}</h1><p>${sub}</p></div>${right}</div>`}
function render(){nav();if(tab==='grade')screenGrade();else if(tab==='config')screenConfig();else if(tab==='keys')screenKeys();else if(tab==='camera')screenCamera();else if(tab==='students')screenStudents();else screenHistory();}
function summary(g){return `<div class="score-banner"><div><div class="small" style="color:#8bddda;font-weight:800;text-transform:uppercase;letter-spacing:1px">KẾT QUẢ CHẤM TRỰC TIẾP</div><div id="summary-name" class="student-name" style="margin-top:6px">${esc(data.student.name||'Chưa xác định học sinh')}</div><div class="sub">SBD: <span id="summary-sbd">${esc(data.student.sbd||'—')}</span> &nbsp; • &nbsp; Mã đề: <span id="summary-code">${esc(data.student.code||'—')}</span></div></div><div style="text-align:right"><div class="small" style="color:#b3dbe1;font-weight:700">TỔNG ĐIỂM</div><div class="score-total"><span id="grand-score">${fmt(g.total)}</span><small> / <span id="grand-max">${fmt(g.max)}</span></small></div></div></div><div class="score-parts" id="part-scores">${summaryParts(g)}</div>`}
function summaryParts(g){return ['one','two','three'].map((p,i)=>`<div class="score-part"><div class="row between" style="gap:2px"><span class="small muted" style="font-weight:750">PHẦN ${['I','II','III'][i]}</span><span class="small muted">${data.counts[p]} câu</span></div><div style="margin-top:5px"><b>${fmt(g[p].earned)}</b> <span class="meta">/ ${fmt(g[p].max)} điểm</span></div><div class="meter"><i style="width:${g[p].max>0?Math.min(100,100*g[p].earned/g[p].max):0}%"></i></div></div>`).join('')}
function updateSummary(){const g=grading(),el=document.getElementById('part-scores');if(!el)return;document.getElementById('summary-name').textContent=data.student.name||'Chưa xác định học sinh';document.getElementById('summary-sbd').textContent=data.student.sbd||'—';document.getElementById('summary-code').textContent=data.student.code||'—';document.getElementById('grand-score').textContent=fmt(g.total);document.getElementById('grand-max').textContent=fmt(g.max);el.innerHTML=summaryParts(g);const d=document.getElementById('status-grade');if(d)d.innerHTML=statsLine(g)}
function statsLine(g){const done=['one','two','three'].reduce((s,p)=>s+g[p].details.filter(x=>x.filled).length,0);const n=['one','two','three'].reduce((s,p)=>s+data.counts[p],0);return `<span class="pill good">Đã có đáp án: ${done}/${n} câu</span> <span class="pill">Điểm tạm tính: ${fmt(g.total)}/${fmt(g.max)}</span>`}
function sectionTabs(active,attr){return `<div class="tabstrip">${['one','two','three'].map((p,i)=>`<button class="tabbtn ${active===p?'active':''}" data-${attr}="${p}">Phần ${['I','II','III'][i]} (${data.counts[p]} câu)</button>`).join('')}</div>`}
function nameKey(value){
 return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d')
 .toLocaleLowerCase('vi-VN').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
}
function levenshtein(a,b){
 if(a===b)return 0;
 const prev=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
  let before=prev[0];prev[0]=i;
  for(let j=1;j<=b.length;j++){
   const last=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,before+(a[i-1]===b[j-1]?0:1));before=last;
  }
 }
 return prev[b.length];
}
function suggestionsForOCR(text){
 const key=nameKey(text);if(key.length<4||!data.roster.length)return [];
 return data.roster.map(r=>{
  const candidate=nameKey(r.name),edit=1-levenshtein(key,candidate)/Math.max(key.length,candidate.length,1);
  const ta=key.split(' '),tb=candidate.split(' '),same=ta.filter(t=>tb.includes(t)).length;
  const token=2*same/(ta.length+tb.length||1);
  return {sbd:r.sbd,name:r.name,lop:r.lop||'',score:Math.max(edit,edit*.78+token*.22)};
 }).filter(r=>r.score>=.48).sort((a,b)=>b.score-a.score).slice(0,5);
}
function strongNameMismatch(){
 if(ocrState.status!=='done'||ocrState.confidence<65||!data.student.sbd||!data.student.name)return false;
 const key=nameKey(ocrState.raw),own=nameKey(data.student.name);
 if(key.length<6||key===own)return false;
 return ocrState.candidates.some(r=>r.score>=.94&&String(r.sbd)!==String(data.student.sbd));
}
function recognizedNamePanel(){
 if(!ocrState.status)return '';
 const hasSBD=!!data.roster.find(r=>String(r.sbd)===String(data.student.sbd));
 const actualName=data.student.name||'';
 const ocrKey=nameKey(ocrState.raw),actualKey=nameKey(actualName);
 const discrepancy=strongNameMismatch()||(hasSBD&&ocrKey.length>=5&&actualKey.length>=5&&
  (1-levenshtein(ocrKey,actualKey)/Math.max(ocrKey.length,actualKey.length))<.55);
 const status=ocrState.status==='loading'?'Đang tải bộ nhận diện tiếng Việt…':ocrState.status==='recognizing'?'Đang đọc dòng họ và tên…':ocrState.status==='done'?'Đã phân tích dòng họ tên':'Chưa thể đọc chữ trên phiếu';
 return `<div class="ocr-panel" id="ocr-identity-box">
  <div class="section-title" style="margin:0"><b>🔤 Họ tên trên phiếu • OCR tiếng Việt</b><span class="pill ${ocrState.status==='done'?'good':'warn'}">${esc(status)}</span></div>
  ${ocrState.preview?`<img class="ocr-preview" src="${ocrState.preview}" alt="Vùng họ và tên được cắt từ ảnh phiếu">`:''}
  ${ocrState.raw?`<div class="small muted">Chữ máy nhận dạng (chưa xác thực)</div><div class="ocr-raw">${esc(ocrState.raw)}</div><div class="ocr-status">Độ tin cậy OCR ước tính: ${Math.round(ocrState.confidence)}%. Chữ viết tay có thể sai dấu hoặc sai chữ.</div>`:''}
  ${ocrState.note?`<div class="ocr-status ${ocrState.status==='error'?'error':''}">${esc(ocrState.note)}</div>`:''}
  ${discrepancy?`<div class="notice" style="margin-top:8px">⚠ Tên OCR khác với danh sách theo SBD. Hãy xem lại vùng ảnh trước khi lưu. <b>Ứng dụng không tự thay thế tên đã xác định bằng SBD.</b></div>`:''}
  ${(!hasSBD||strongNameMismatch())&&ocrState.candidates.length?`<div class="label" style="margin-top:11px">Gợi ý từ danh sách — chạm để xác nhận đúng học sinh:</div><div class="ocr-candidates">${ocrState.candidates.map(r=>`<button class="btn sm secondary" data-act="confirm-ocr" data-sbd="${esc(r.sbd)}">${esc(r.name)} • ${esc(r.sbd)}${r.lop?' • '+esc(r.lop):''}</button>`).join('')}</div>`:''}
  ${!hasSBD&&ocrState.status==='done'&&!ocrState.candidates.length?'<div class="notice" style="margin-top:8px">Chưa tìm thấy tên trùng khớp trong danh sách. Hãy chọn học sinh ở ô bên trên, không lưu theo tên OCR chưa xác thực.</div>':''}
  ${strongNameMismatch()&&!ocrState.mismatchReviewed?`<div class="notice" style="margin-top:9px"><b>Chưa cho phép lưu:</b> tên OCR khớp một học sinh khác trong danh sách. Kiểm tra ảnh và chọn tên đúng, hoặc <button class="btn sm" data-act="confirm-sbd">Xác nhận tên theo SBD là đúng</button>.</div>`:''}
  <div class="row" style="margin-top:10px"><button class="btn sm" data-act="retry-ocr" ${!photo||camPts.length!==4?'disabled':''}>↻ Nhận dạng lại tên</button><span class="small muted">OCR chạy trên trình duyệt; cần Internet để tải bộ tiếng Việt lần đầu.</span></div>
 </div>`;
}
function ocrPanelUpdate(){const box=document.getElementById('ocr-panel-slot');if(box)box.innerHTML=recognizedNamePanel()}
function loadTesseract(){
 if(window.Tesseract?.createWorker)return Promise.resolve(window.Tesseract);
 if(ocrScriptPromise)return ocrScriptPromise;
 ocrScriptPromise=new Promise((resolve,reject)=>{
  const el=document.createElement('script');el.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';el.async=true;
  el.onload=()=>window.Tesseract?.createWorker?resolve(window.Tesseract):reject(Error('Không khởi tạo được thư viện OCR'));
  el.onerror=()=>reject(Error('Không tải được OCR. Hãy bật Internet, hoặc kiểm tra chặn CDN.'));
  document.head.appendChild(el);
 }).catch(e=>{ocrScriptPromise=null;throw e});
 return ocrScriptPromise;
}
async function getOCRWorker(){
 if(!ocrWorkerPromise){
  ocrWorkerPromise=(async()=>{
   const t=await loadTesseract();
   const worker=await t.createWorker('vie',1);
   await worker.setParameters({tessedit_pageseg_mode:7,preserve_interword_spaces:'1'});
   return worker;
  })().catch(e=>{ocrWorkerPromise=null;throw e});
 }
 return ocrWorkerPromise;
}
// Trích riêng dòng tên ở mục 4 trên mẫu phiếu 768 × 1097, sửa phối cảnh từ 4 ô định vị.
function cropVietnameseName(wide=false){
 if(!photo||camPts.length!==4)throw Error('Cần ảnh và 4 ô định vị trước khi đọc tên');
 const map=perspective(),input=document.createElement('canvas');input.width=photo.naturalWidth||photo.width;input.height=photo.naturalHeight||photo.height;
 const sourceCtx=input.getContext('2d',{willReadFrequently:true});sourceCtx.drawImage(photo,0,0);
 const pixels=sourceCtx.getImageData(0,0,input.width,input.height).data;
 const x0=323,y0=206,x1=505,y1=wide?248:231,scale=5;
 const c=document.createElement('canvas');c.width=(x1-x0)*scale;c.height=(y1-y0)*scale;
 const outCtx=c.getContext('2d'),out=outCtx.createImageData(c.width,c.height),dest=out.data;
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
  const [px,py]=map(x0+(x+.5)/scale,y0+(y+.5)/scale),xx=Math.round(px),yy=Math.round(py),j=(y*c.width+x)*4;
  if(xx<0||xx>=input.width||yy<0||yy>=input.height){dest[j]=dest[j+1]=dest[j+2]=255;dest[j+3]=255;continue;}
  const k=(yy*input.width+xx)*4;
  // Giảm chữ in nhạt của đường kẻ; giữ phần chữ viết tay đậm.
  const grey=Math.round(.299*pixels[k]+.587*pixels[k+1]+.114*pixels[k+2]);
  const v=grey>220?255:grey<80?0:Math.round((grey-80)*255/140);
  dest[j]=dest[j+1]=dest[j+2]=v;dest[j+3]=255;
 }
 outCtx.putImageData(out,0,0);return c;
}
async function recognizeVietnameseName(){
 if(!photo||camPts.length!==4)return;
 const token=++scanToken;
 let canvas;
 try{canvas=cropVietnameseName()}catch(e){ocrState={status:'error',raw:'',confidence:0,candidates:[],preview:'',note:e.message};ocrPanelUpdate();return}
 ocrState={status:'loading',raw:'',confidence:0,candidates:[],preview:canvas.toDataURL('image/jpeg',.83),note:'Đang chuẩn bị bộ nhận diện vie. Tên có dấu sẽ đối chiếu danh sách lớp.'};ocrPanelUpdate();
 try{
  const worker=await getOCRWorker();if(token!==scanToken)return;
  ocrState.status='recognizing';ocrPanelUpdate();
  const parseResult=(res,preview)=>{
   const raw=String(res.data?.text||'').normalize('NFC').replace(/[\r\n]+/g,' ').replace(/[^\p{L}\s'-]/gu,' ').replace(/\s+/g,' ').trim();
   const candidates=suggestionsForOCR(raw);
   return {raw,confidence:Number(res.data?.confidence||0),candidates,preview};
  };
  let option=parseResult(await worker.recognize(canvas),ocrState.preview);if(token!==scanToken)return;
  // Nếu mẫu tên ngắn không khớp, thử vùng cao hơn cho chữ viết tay lớn.
  if((option.candidates[0]?.score||0)<.86){
   ocrState.note='Đang thử vùng nhận dạng rộng hơn cho chữ viết tay…';ocrPanelUpdate();
   const wide=cropVietnameseName(true);
   const alt=parseResult(await worker.recognize(wide),wide.toDataURL('image/jpeg',.83));if(token!==scanToken)return;
   const strength=o=>Math.max(0,o.candidates[0]?.score||0)*100+Math.min(99,o.confidence)*.12;
   if(strength(alt)>strength(option)+3)option=alt;
  }
  const {raw,confidence,candidates,preview}=option;
  ocrState={status:'done',raw,confidence,candidates,preview,mismatchReviewed:false,note:raw?'Kết quả là gợi ý OCR; đối chiếu SBD và tên trên phiếu để tránh nhầm.':'Không nhận ra tên. Có thể do chữ viết tay, ảnh thiếu nét hoặc vùng tên còn trống.'};
  if(tab==='grade')ocrPanelUpdate();
  if(!data.student.name&&ocrState.candidates.length){toast('Đã có gợi ý họ tên tiếng Việt. Hãy chạm để xác nhận trước khi lưu.');}
 }catch(e){if(token!==scanToken)return;ocrState={...ocrState,status:'error',note:'Không thể nhận dạng OCR tiếng Việt: '+String(e.message||e)};ocrPanelUpdate();}
}

function updateCamView(){if(tab!=='camera')return;const box=document.getElementById('cam-box'),help=document.getElementById('corner-help'),read=document.getElementById('btn-read'),reset=document.getElementById('btn-reset');if(photo){box.innerHTML='<div class="overlay-stage"><canvas id="photo-canvas"></canvas></div>';const c=document.getElementById('photo-canvas'),mx=Math.min(1100/photo.width,750/photo.height,1),w=Math.round(photo.width*mx),h=Math.round(photo.height*mx);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(photo,0,0,w,h);ctx.fillStyle='#00f5c8';ctx.strokeStyle='#00f5c8';ctx.lineWidth=2;camPts.forEach(([px,py],i)=>{const x=px*mx,y=py*mx;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.font='bold 18px Arial';ctx.fillText(String(i+1),x+9,y-8)});if(camPts.length===4){ctx.beginPath();camPts.forEach(([px,py],i)=>i?ctx.lineTo(px*mx,py*mx):ctx.moveTo(px*mx,py*mx));ctx.closePath();ctx.stroke()}c.onclick=e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)*photo.width/r.width,y=(e.clientY-r.top)*photo.height/r.height;if(camPts.length>=4)camPts=[];camPts.push([x,y]);updateCamView()};help.textContent=camPts.length===4?'✓ Đã đặt 4 góc — sẵn sàng đọc ô tô':'Chạm mốc số '+(camPts.length+1)+'/4 — '+['trên trái','trên phải','dưới phải','dưới trái'][camPts.length];read.disabled=camPts.length!==4;reset.disabled=camPts.length===0}

function perspective(){const pts=[[25,20],[747,20],[747,1064],[25,1064]];let A=[],B=[];pts.forEach(([x,y],i)=>{const [u,v]=camPts[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);B.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);B.push(v)});for(let k=0;k<8;k++){let best=k;for(let j=k+1;j<8;j++)if(Math.abs(A[j][k])>Math.abs(A[best][k]))best=j;[A[k],A[best]]=[A[best],A[k]];[B[k],B[best]]=[B[best],B[k]];if(Math.abs(A[k][k])<1e-10)throw Error('Không hiệu chỉnh được 4 điểm, hãy chọn lại');const div=A[k][k];for(let j=k;j<8;j++)A[k][j]/=div;B[k]/=div;for(let i=0;i<8;i++){if(i===k)continue;const t=A[i][k];for(let j=k;j<8;j++)A[i][j]-=t*A[k][j];B[i]-=t*B[k]}}return (x,y)=>{const z=B[6]*x+B[7]*y+1;return [(B[0]*x+B[1]*y+B[2])/z,(B[3]*x+B[4]*y+B[5])/z]}}

 data.history.unshift(entry);save();toast('Đã lưu '+entry.name+' • '+fmt(g.total)+' điểm');return true;
}
function exportHistory(){if(!data.history.length){toast('Chưa có kết quả để xuất');return}const rows=[['Thời gian','Họ và tên','Số báo danh','Mã đề','Điểm phần I','Điểm phần II','Điểm phần III','Tổng điểm','Thang điểm'],...data.history.map(h=>[h.at,h.name,h.sbd,h.code,h.scores.one,h.scores.two,h.scores.three,h.scores.total,h.scores.max])];const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Bang_diem_SmartOMR.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function backupAll(){const content=JSON.stringify({app:'SmartOMR',version:'1.0',date:new Date().toISOString(),data},null,2);
const blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SmartOMR_SaoLuu_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1800);toast('Đã tạo tệp sao lưu; kiểm tra thư mục tải xuống.');}
function validBackupData(d){if(!d||typeof d!=='object'||!d.counts||!d.keys||!d.weights||!d.responses||!d.student)return false;
if(!Array.isArray(d.roster)||!Array.isArray(d.history)||!Array.isArray(d.scoreScale)||d.scoreScale.length!==5)return false;
return ['one','two','three'].every(p=>Number.isInteger(d.counts[p])&&d.counts[p]>=0&&d.counts[p]<=maxima[p]&&
Array.isArray(d.weights[p])&&d.weights[p].length>=maxima[p]&&Array.isArray(d.keys[p])&&d.keys[p].length>=maxima[p]&&
Array.isArray(d.responses[p])&&d.responses[p].length>=maxima[p]);}
function restoreAll(file){if(!file)return;if(file.size>20*1024*1024){toast('Tệp sao lưu quá lớn (>20 MB).');return;}
const reader=new FileReader();reader.onerror=()=>toast('Không mở được tệp sao lưu.');reader.onload=()=>{
try{const parsed=JSON.parse(String(reader.result));if(parsed.app!=='SmartOMR'||!validBackupData(parsed.data))throw Error('Tệp không đúng cấu trúc SmartOMR.');
if(!confirm('Khôi phục sẽ thay thế toàn bộ danh sách, đáp án và bảng điểm đang lưu trên trình duyệt này. Tiếp tục?'))return;
stopCam();photo=null;camRead=null;camPts=[];ocrState={status:'',raw:'',confidence:0,candidates:[],preview:'',note:''};data=parsed.data;save();tab='history';render();toast('Đã khôi phục '+data.history.length+' bài chấm và '+data.roster.length+' học sinh.');
}catch(error){toast('Không khôi phục được: '+error.message);}};reader.readAsText(file,'utf-8');}
function onClick(e){const target=e.target.closest('[data-tab],[data-act],[data-grade-section],[data-cfg-section],[data-key-section],[data-res-one],[data-res-two],[data-key-one],[data-key-two]');if(!target)return;
if(target.dataset.tab){if(target.tagName==='A')e.preventDefault();if(tab==='camera'&&target.dataset.tab!=='camera')stopCam();tab=target.dataset.tab;render();return}
if(target.dataset.gradeSection){gradeSection=target.dataset.gradeSection;rerenderGradeQuestions();document.querySelectorAll('[data-grade-section]').forEach(b=>b.classList.toggle('active',b.dataset.gradeSection===gradeSection));return}
if(target.dataset.cfgSection){section=target.dataset.cfgSection;document.getElementById('weight-rows').innerHTML=weightRows(section);document.querySelectorAll('[data-cfg-section]').forEach(b=>b.classList.toggle('active',b.dataset.cfgSection===section));return}
if(target.dataset.keySection){keySection=target.dataset.keySection;document.getElementById('key-rows').innerHTML=keyRows(keySection);document.querySelectorAll('[data-key-section]').forEach(b=>b.classList.toggle('active',b.dataset.keySection===keySection));return}
if(target.dataset.resOne!==undefined){const i=Number(target.dataset.resOne),a=target.dataset.a;data.responses.one[i]=data.responses.one[i]===a?'':a;save();rerenderGradeQuestions();return}
if(target.dataset.resTwo!==undefined){const i=Number(target.dataset.resTwo),j=Number(target.dataset.sub),a=target.dataset.a;data.responses.two[i][j]=data.responses.two[i][j]===a?'':a;save();rerenderGradeQuestions();return}
if(target.dataset.keyOne!==undefined){data.keys.one[Number(target.dataset.keyOne)]=target.dataset.a;save();rerenderKeys();return}
if(target.dataset.keyTwo!==undefined){data.keys.two[Number(target.dataset.keyTwo)][Number(target.dataset.sub)]=target.dataset.a;save();rerenderKeys();return}
const act=target.dataset.act;
if(act==='confirm-ocr'){
 const picked=data.roster.find(r=>String(r.sbd)===String(target.dataset.sbd));
 if(!picked){toast('Không tìm thấy học sinh trong danh sách.');return;}
 data.student={...data.student,sbd:picked.sbd,name:picked.name,lop:picked.lop||'',source:'ocr-confirmed'};
 save();render();toast('Đã xác nhận: '+picked.name+' • SBD '+picked.sbd);return;
}
if(act==='confirm-sbd'){ocrState.mismatchReviewed=true;ocrPanelUpdate();toast('Đã xác nhận theo SBD. Có thể lưu bảng điểm.');return;}
if(act==='retry-ocr'){recognizeVietnameseName();return;}
if(act==='save-grade')saveResult();else if(act==='save-next'){if(saveResult())newPaper(true)}else if(act==='new-paper')newPaper();else if(act==='clear'){data.responses=emptyResponses();save();render();toast('Đã xóa đáp án bài làm hiện tại')}else if(act==='sample'){data.responses=JSON.parse(JSON.stringify(seed.responses));save();render();toast('Đã nạp bài làm minh họa')}else if(act==='sample-keys'){data.keys=JSON.parse(JSON.stringify(seed.keys));save();render();toast('Đã khôi phục đáp án mẫu')}else if(act==='distribute'){const p=target.dataset.part,count=data.counts[p],f=document.querySelector(`[data-total="${p}"]`),total=Math.max(0,num(f.value));if(!count){toast('Phần này chưa có câu hỏi');return}for(let i=0;i<count;i++)data.weights[p][i]=total/count;save();render();toast(`Đã chia ${fmt(total)} điểm cho ${count} câu của ${names[p]}`)}else if(act==='add-student'){const sbd=document.getElementById('roster-sbd').value.trim(),name=document.getElementById('roster-name').value.trim().normalize('NFC'),lop=document.getElementById('roster-class').value.trim();if(!sbd||!name){toast('Cần nhập SBD và họ tên');return}const prev=data.roster.find(x=>x.sbd===sbd);if(prev){prev.name=name;prev.lop=lop}else data.roster.push({sbd,name,lop});save();screenStudents();toast('Đã lưu học sinh: '+name)}else if(act==='remove-student'){data.roster.splice(Number(target.dataset.index),1);save();screenStudents()}else if(act==='sample-roster'){data.roster=JSON.parse(JSON.stringify(seed.roster));save();screenStudents();toast('Đã nạp danh sách học sinh mẫu')}else if(act==='export')exportHistory();else if(act==='backup')backupAll();else if(act==='load-history'){const h=data.history[Number(target.dataset.index)];data.student=JSON.parse(JSON.stringify(h.student));data.responses=JSON.parse(JSON.stringify(h.responses));tab='grade';save();render()}else if(act==='start-cam')startCam();else if(act==='snap')snapCam();else if(act==='reset-corners'){camPts=[];updateCamView()}else if(act==='read-photo')readPhoto();else if(act==='goto-grade'){tab='grade';render()}}
function onChange(e){const t=e.target,d=t.dataset;
if(t.id==='student-picker'){
 const r=data.roster.find(x=>x.sbd===t.value);data.student.sbd=r?r.sbd:'';matchStudent();data.student.source=r?'manual':'';save();updateIdentity();return;
}
if(t.id==='student-search'){
 const picker=document.getElementById('student-picker');if(picker)picker.innerHTML=studentOptions(t.value);return;
}
if(d.student!==undefined){data.student[d.student]=t.value;if(d.student==='sbd'&&matchStudent()){const name=document.querySelector('[data-student="name"]');if(name)name.value=data.student.name;}save();updateSummary()}else if(d.resThree!==undefined){data.responses.three[Number(d.resThree)]=t.value;save();updateSummary();const parent=t.closest('.qbox');if(parent){const x=grading().three.details[Number(d.resThree)],label=parent.querySelector('.qscore'),status=parent.querySelector('.small');if(label)label.textContent=fmt(x.earned)+' / '+fmt(x.max);if(status){status.textContent=x.ok?'✓ Đúng':'Đáp án: '+data.keys.three[Number(d.resThree)];status.style.color=x.ok?'#148a65':'#8794a6'}}}
else if(d.keyThree!==undefined){data.keys.three[Number(d.keyThree)]=t.value;save()}else if(d.weight!==undefined){data.weights[d.weight][Number(d.idx)]=Math.max(0,num(t.value));save();const total=Array.from(document.querySelectorAll('.summary-strip span')).at(-1);if(total)total.textContent=fmt(allMax())+' điểm'}else if(d.count!==undefined){const p=d.count,c=Math.min(maxima[p],Math.max(0,Math.trunc(num(t.value))));data.counts[p]=c;save();screenConfig();toast(`Đã đặt ${names[p]}: ${c} câu`)}else if(d.scale!==undefined){data.scoreScale[Number(d.scale)]=Math.min(1,Math.max(0,num(t.value)));save()}else if(t.id==='file-photo'){initFile(t.files[0])}else if(t.id==='roster-file'){importRoster(t.files[0])}else if(t.id==='backup-file'){restoreAll(t.files[0])}}
// Total points field is a target for the "Chia đều" button; changing it does not mutate individual per-question points until clicked.
document.addEventListener('click',onClick);document.addEventListener('input',e=>{if(e.target.matches('[data-student],[data-res-three],[data-key-three],#student-search'))onChange(e)});document.addEventListener('change',e=>{if(e.target.matches('[data-student],[data-res-three],[data-key-three],#student-search'))return;onChange(e)});window.addEventListener('beforeunload',stopCam);render();
})();
